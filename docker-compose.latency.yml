# MySQL instead of SQLite, with toxiproxy between the app and both MySQL and
# Redis so a fixed delay can be added to every response:
#
#   docker compose -f docker-compose.yml -f docker-compose.latency.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.latency.yml exec app php artisan bench:latency 1
#   docker compose -f docker-compose.yml -f docker-compose.latency.yml exec app php artisan bench:markdown 1 --warm=5 --runs=30
services:
  app:
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=toxiproxy
      - DB_PORT=13306
      - DB_DATABASE=benchmark
      - DB_USERNAME=benchmark
      - DB_PASSWORD=benchmark
      - REDIS_HOST=toxiproxy
      - REDIS_PORT=16379
      - TOXIPROXY_URL=http://toxiproxy:8474
    depends_on:
      toxiproxy:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: benchmark
      MYSQL_USER: benchmark
      MYSQL_PASSWORD: benchmark
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./docker/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
